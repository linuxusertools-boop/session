<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEV API | STABLE SESSION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
        :root { --bg: #f0eee4; --black: #000; --white: #fff; --accent: #25d366; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); padding: 2rem 1rem; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: var(--white); border: 4px solid var(--black); box-shadow: 8px 8px 0px var(--black); padding: 2rem; text-align: center; }
        input { width: 100%; padding: 15px; border: 4px solid var(--black); margin: 1rem 0; font-weight: bold; font-size: 1.1rem; }
        button { width: 100%; padding: 15px; background: var(--black); color: var(--white); border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        #code-box { font-size: 2.5rem; font-weight: 900; margin: 1.5rem 0; padding: 1rem; border: 4px dashed var(--black); background: #eee; min-height: 80px; display: flex; align-items: center; justify-content: center; letter-spacing: 5px; }
        .status { margin-top: 1rem; font-weight: bold; font-size: 0.9rem; padding: 10px; border: 2px solid var(--black); display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1 style="line-height: 0.9; margin-bottom: 10px;">KEV<br>SESSION</h1>
        <p>Gunakan nomor HP (contoh: 62812xxx)</p>
        
        <input type="number" id="number" placeholder="628xxxxxxxxx">
        
        <div id="code-box">--------</div>
        
        <button id="btn" onclick="pair()">Dapatkan Kode</button>
        <div id="status" class="status"></div>
    </div>
</div>

<script>
    async function pair() {
        const num = document.getElementById('number').value;
        const btn = document.getElementById('btn');
        const codeBox = document.getElementById('code-box');
        const status = document.getElementById('status');

        if(!num) return alert("Masukkan nomor!");

        btn.disabled = true;
        status.style.display = "block";
        status.innerHTML = "Menghubungkan ke jembatan API...";
        codeBox.innerHTML = "...";

        try {
            // Kita gunakan API eksternal yang stabil untuk bypass limit Vercel
            const res = await fetch(`https://c-o-r-t-e-x.vercel.app/code?number=${num}`);
            const data = await res.json();

            if(data.code) {
                codeBox.innerHTML = data.code;
                status.innerHTML = "BERHASIL! Masukkan kode ini di WhatsApp Anda.";
                status.style.background = "#25d366";
            } else {
                throw new Error();
            }
        } catch (e) {
            status.innerHTML = "Gagal. Coba lagi atau ganti nomor.";
            status.style.background = "#ff9494";
            codeBox.innerHTML = "ERROR";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
