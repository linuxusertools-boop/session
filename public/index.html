<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEV API | PAIRING SYSTEM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');

        :root {
            --bg: #f5f5f5;
            --black: #1a1a1a;
            --white: #ffffff;
            --accent: #25d366;
            --error: #ff4747;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            color: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: var(--white);
            border: 4px solid var(--black);
            box-shadow: 10px 10px 0px var(--black);
            padding: 2.5rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        p {
            font-size: 0.9rem;
            margin-bottom: 2rem;
            font-weight: 500;
            color: #555;
        }

        .input-wrapper {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 3px solid var(--black);
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            background: #fffdf0;
            box-shadow: 4px 4px 0px var(--black);
        }

        #code-display {
            background: #fdfdfd;
            border: 4px dashed var(--black);
            padding: 1.5rem;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 6px;
            margin: 1.5rem 0;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--black);
        }

        button {
            width: 100%;
            padding: 18px;
            background: var(--black);
            color: var(--white);
            border: none;
            font-family: inherit;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.1s;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--accent);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #status-msg {
            margin-top: 1.2rem;
            padding: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 2px solid var(--black);
            display: none;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.4;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>KEV<br>SESSION</h1>
        <p>Hubungkan WhatsApp ke Vercel tanpa drama.</p>

        <div class="input-wrapper">
            <label>Nomor WhatsApp (dengan kode negara)</label>
            <input type="number" id="phoneNumber" placeholder="Contoh: 628123456789">
        </div>

        <div id="code-display">--------</div>

        <button id="submitBtn" onclick="requestPairing()">Generate Code</button>

        <div id="status-msg"></div>

        <div class="footer">KevCodex &copy; 2026</div>
    </div>
</div>

<script>
    async function requestPairing() {
        const phone = document.getElementById('phoneNumber').value;
        const btn = document.getElementById('submitBtn');
        const codeBox = document.getElementById('code-display');
        const status = document.getElementById('status-msg');

        if (!phone || phone.length < 9) {
            alert("Harap masukkan nomor WhatsApp yang benar!");
            return;
        }

        // Reset UI
        btn.disabled = true;
        status.style.display = "block";
        status.style.background = "#fff";
        status.innerHTML = "🌀 Sedang memproses di Server Vercel...";
        codeBox.innerHTML = "....";

        try {
            // Memanggil API internal /api/session.js
            const response = await fetch(`/api/session?number=${phone}`);
            
            // Cek jika response bukan JSON (Vercel Crash)
            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new Error("Vercel Runtime Error (Check Logs)");
            }

            const data = await response.json();

            if (data.code) {
                codeBox.innerHTML = data.code;
                status.style.background = "#25d366";
                status.innerHTML = "✅ BERHASIL! Masukkan kode ini pada notifikasi WhatsApp di HP Anda.";
            } else {
                throw new Error(data.error || "Gagal mendapatkan kode.");
            }
        } catch (err) {
            console.error(err);
            status.style.background = "#ff4747";
            status.style.color = "#fff";
            status.innerHTML = "❌ ERROR: " + err.message;
            codeBox.innerHTML = "FAILED";
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
